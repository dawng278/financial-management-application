<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Executive Finance - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e1e3e4",
                        "primary-container": "#5c7987",
                        "on-primary-fixed-variant": "#2e4b57",
                        "on-primary-fixed": "#001f2a",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#42484b",
                        "on-surface": "#191c1d",
                        "on-error": "#ffffff",
                        "on-primary-container": "#fbfdff",
                        "outline": "#72787b",
                        "surface-bright": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "secondary-fixed-dim": "#ffb1c1",
                        "secondary": "#FF1493", // Neon Pink
                        "surface-tint": "#466270",
                        "on-background": "#191c1d",
                        "surface-variant": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "on-secondary-fixed": "#3f0018",
                        "secondary-fixed": "#ffd9df",
                        "primary": "#43606d",
                        "inverse-primary": "#adcbda",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e7e8e9",
                        "surface": "#f8f9fa",
                        "primary-fixed-dim": "#adcbda",
                        "tertiary": "#186a22",
                        "tertiary-container": "#358438",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#005312",
                        "surface-container": "#edeeef",
                        "on-secondary-fixed-variant": "#8f003f",
                        "error": "#ba1a1a",
                        "secondary-container": "#FF69B4",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#88d982",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "on-tertiary-fixed": "#002204",
                        "primary-fixed": "#c9e7f7",
                        "background": "#f8f9fa",
                        "on-secondary-container": "#fffbff",
                        "surface-dim": "#d9dadb",
                        "on-tertiary-container": "#f7fff1",
                        "tertiary-fixed": "#a3f69c",
                        "outline-variant": "#c2c7cb"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background: radial-gradient(circle at top right, #f8f9fa, #e9ecef);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .neo-button-glow {
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
        }
        .neo-button-glow:hover {
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px white, 0 0 0 4px #FF1493;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6 selection:bg-secondary selection:text-white">
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10">
<div class="absolute -top-[10%] -right-[10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute top-[20%] -left-[10%] w-[400px] h-[400px] bg-secondary/10 rounded-full blur-[100px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[460px] animate-in fade-in duration-700">
<!-- Header / Logo Section -->
<div class="flex flex-col items-center mb-12">
<div class="w-20 h-20 bg-primary rounded-2xl flex items-center justify-center mb-6 shadow-2xl shadow-primary/30 transform transition hover:scale-105">
<span class="material-symbols-outlined text-on-primary text-5xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-extrabold text-4xl text-on-surface tracking-tight mb-2">Executive Finance</h1>
<p class="text-on-surface-variant font-medium text-lg opacity-80">Premium Workspace Access</p>
</div>
<!-- Login Card -->
<div class="glass-card p-10 rounded-2xl shadow-[0_32px_64px_-16px_rgba(0,0,0,0.1)]">
<form class="space-y-8">
<!-- Username Field -->
<div class="space-y-2.5">
<label class="block text-[11px] font-extrabold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Username / Executive ID</label>
<div class="relative group input-focus-ring rounded-xl transition-all">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline/80 text-xl group-focus-within:text-secondary transition-colors" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-14 pr-5 py-4 bg-white/50 border border-outline-variant/30 rounded-xl focus:border-transparent focus:ring-0 text-on-surface placeholder:text-outline/40 font-semibold transition-all outline-none" placeholder="e.g. CEO-99234" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2.5">
<div class="flex justify-between items-center ml-1">
<label class="block text-[11px] font-extrabold uppercase tracking-[0.2em] text-on-surface-variant">Secure Password</label>
</div>
<div class="relative group input-focus-ring rounded-xl transition-all">
<div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline/80 text-xl group-focus-within:text-secondary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-14 pr-14 py-4 bg-white/50 border border-outline-variant/30 rounded-xl focus:border-transparent focus:ring-0 text-on-surface placeholder:text-outline/40 font-semibold transition-all outline-none" placeholder="••••••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-5 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-lg border border-outline-variant bg-white/50 checked:bg-secondary checked:border-secondary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white text-xs scale-0 peer-checked:scale-100 left-1 pointer-events-none transition-transform" data-icon="done" style="font-variation-settings: 'wght' 700;">done</span>
</div>
<span class="text-sm font-bold text-on-surface-variant/80 group-hover:text-primary transition-colors">Remember me</span>
</label>
<a class="text-sm font-bold text-primary hover:text-secondary transition-colors" href="#">Forgot key?</a>
</div>
<!-- Login Button -->
<button class="w-full bg-secondary text-on-secondary py-5 rounded-xl font-extrabold text-lg neo-button-glow hover:bg-secondary-container active:scale-[0.98] transition-all flex items-center justify-center gap-3 mt-4" type="submit">
<span>Access Workspace</span>
<span class="material-symbols-outlined text-2xl" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Footer Actions -->
<div class="mt-10 text-center space-y-6">
<div class="flex flex-col items-center gap-2">
<p class="text-on-surface-variant font-medium">
                New to the executive tier? 
            </p>
<div class="flex gap-4">
<a class="text-secondary font-extrabold hover:underline underline-offset-4" href="#">Request Access</a>
<span class="text-outline/30">•</span>
<a class="text-primary font-extrabold hover:underline underline-offset-4" href="#">Sign Up Now</a>
</div>
</div>
<div class="flex items-center justify-center gap-8 pt-6 border-t border-outline-variant/10">
<div class="flex items-center gap-2 text-on-surface-variant/40">
<span class="material-symbols-outlined text-xl" data-icon="verified_user">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-[0.15em]">Verified Secure</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant/40">
<span class="material-symbols-outlined text-xl" data-icon="shield">shield</span>
<span class="text-[10px] font-bold uppercase tracking-[0.15em]">AES-256 Auth</span>
</div>
</div>
</div>
</main>
</body></html>
